[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nacho"
version = "0.1.0"
description = "Notion 데이터베이스 행 생성·업데이트·조회 자동화 도구. 셸에서 직접 호출하거나 Claude Code 슬래시 커맨드로 세션 컨텍스트와 함께 사용."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.scripts]
nacho = "nacho.main:run"

[tool.setuptools.packages.find]
include = ["nacho*"]
